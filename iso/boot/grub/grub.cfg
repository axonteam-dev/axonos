timeout=10
insmod all_video
insmod gfxterm

GRUB_DISTRIBUTOR="AxonOS boot menu"
terminal_output gfxterm
set gfxmode=1024x768x32,800x600x32,auto
set gfxpayload=keep
loadfont /boot/grub/fonts/unicode.pf2
insmod tga
background_image /boot/grub/axonboot.tga

menuentry "AxonOS 4.0.1" {
    multiboot2 /boot/axonos.elf axon.init=systemd systemd.log_target=null systemd.log_level=emerg systemd.log_color=true systemd.show_status=true
    echo "Loading systemd rootfs, please wait..."
    module2 /boot/initfs.sfs initfs
}
