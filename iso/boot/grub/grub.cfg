set timeout=3
set default=0

insmod all_video
insmod gfxterm
insmod font

# Prefer graphics when available; always keep console so headless/QEMU can boot.
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=800x600x8
    terminal_output gfxterm
    insmod tga
    background_image /boot/grub/axonboot.tga
fi
terminal_output --append console
terminal_input console

GRUB_DISTRIBUTOR="AxonOS boot menu"

menuentry "axonOS 4.0.1 Stable" {
    multiboot2 /boot/axonos.elf
    echo "Loading initfs squashfs, please wait..."
    module2 /boot/initfs.squashfs initfs
    boot
}
